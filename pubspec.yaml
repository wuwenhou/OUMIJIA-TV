name: oumijia_tv
description: OUMIJIA TV - Truyền hình Việt Nam, phim và YouTube tuyển chọn; giao diện tối giản, không quảng cáo.
publish_to: "none"
version: 2.0.2+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  youtube_explode_dart: ^2.3.6
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  crypto: ^3.0.7
  cached_network_image: ^3.4.1
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/config/channels.json
