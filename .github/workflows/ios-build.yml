name: Build iOS (unsigned IPA)

on:
  workflow_dispatch: # chạy thủ công khi cần
  push:
    tags:
      - "v*"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r oumijia-tv-ios-unsigned.ipa Payload
          mv oumijia-tv-ios-unsigned.ipa build/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: oumijia-tv-ios
          path: build/oumijia-tv-ios-unsigned.ipa
          retention-days: 30
