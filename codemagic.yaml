# Codemagic CI — build iOS cho OUMIJIA TV (phương án thay thế GitHub Actions)
# Đăng nhập codemagic.io → kết nối repo → chọn workflow "ios-release".

workflows:
  ios-release:
    name: OUMIJIA TV iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: "3.47.8"
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry oumijia-tv-ios-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - oumijia-tv-ios-unsigned.ipa
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - wuwenhou@users.noreply.github.com
        notify:
          success: true
          failure: true
